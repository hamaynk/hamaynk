[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[env]
  SUPABASE_URL = "your_supabase_url"
  SUPABASE_ANON_KEY = "your_supabase_anon_key"
  NETLIFY_BUILD_HOOK_URL = "your_netlify_build_hook_url"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
